server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=mini-shop

# =========================
# Database
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minishop}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================
# Mail
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-name=${MAIL_FROM_NAME}

# =========================
# Frontend
# =========================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# =========================
# Cloudinary
# =========================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =========================
# Upload
# =========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =========================
# Redis
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

spring.cache.type=redis
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=minishop:

# =========================
# AI Service (FastAPI)
# =========================
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# =========================
# VNPay
# =========================
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
vnpay.version=${VNPAY_VERSION:2.1.0}
vnpay.command=${VNPAY_COMMAND:pay}
vnpay.curr-code=${VNPAY_CURR_CODE:VND}
vnpay.locale=${VNPAY_LOCALE:vn}
vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES:15}
vnpay.ipn-url=${VNPAY_IPN_URL:https://your-public-domain/api/payments/vnpay/ipn}
vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/payment-result}

# =========================
# Scheduler
# =========================
app.order.unpaid-expiration-minutes=${ORDER_UNPAID_EXPIRATION_MINUTES:30}
app.scheduler.cancel-unpaid-orders-delay-ms=${ORDER_SCHEDULER_DELAY_MS:60000}
app.scheduler.cancel-unpaid-orders-batch-size=${ORDER_SCHEDULER_BATCH_SIZE:100}

# =========================
# Qdrant
# =========================
qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=${QDRANT_PORT:6333}
qdrant.collection=${QDRANT_COLLECTION:products}
qdrant.api-key=${QDRANT_API_KEY:}
qdrant.https=${QDRANT_HTTPS:false}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile