<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác minh email</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
">

<div style="
    max-width: 600px;
    margin: 40px auto;
    background: #ffffff;
    border-radius: 12px;
    padding: 32px;
">

    <h1 style="
        margin-top: 0;
        color: #333333;
        font-size: 24px;
    ">
        Xác minh email Hair
    </h1>

    <p style="
        color: #555555;
        font-size: 16px;
        line-height: 1.6;
    ">
        Xin chào,
    </p>

    <p style="
        color: #555555;
        font-size: 16px;
        line-height: 1.6;
    ">
        Bạn vừa thêm hoặc thay đổi địa chỉ email
        trong tài khoản Hair.
    </p>

    <p style="
        color: #555555;
        font-size: 16px;
        line-height: 1.6;
    ">
        Vui lòng nhấn nút bên dưới để xác minh
        địa chỉ email này.
    </p>

    <div style="
        text-align: center;
        margin: 32px 0;
    ">

        <a
                th:href="${verificationUrl}"
                style="
                display: inline-block;
                padding: 14px 24px;
                background-color: #111827;
                color: #ffffff;
                text-decoration: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: 600;
            "
        >
            Xác minh email
        </a>

    </div>

    <p style="
        color: #777777;
        font-size: 14px;
        line-height: 1.6;
    ">
        Link xác minh có hiệu lực đến:
    </p>

    <p
            th:text="${expiresAt}"
            style="
            color: #333333;
            font-size: 14px;
            font-weight: 600;
        "
    >
    </p>

    <p style="
        color: #999999;
        font-size: 13px;
        line-height: 1.6;
        margin-top: 32px;
    ">
        Nếu bạn không thực hiện thao tác này,
        vui lòng bỏ qua email này.
    </p>

</div>

</body>
</html>
