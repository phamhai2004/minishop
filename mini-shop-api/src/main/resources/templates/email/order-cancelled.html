<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đơn hàng đã bị hủy</title>
</head>

<body style="
    margin:0;
    padding:0;
    background:#f5f5f5;
    font-family:Arial, Helvetica, sans-serif;
    color:#333333;
">

<table width="100%"
       cellpadding="0"
       cellspacing="0"
       style="background:#f5f5f5; padding:24px 0;">

    <tr>
        <td align="center">

            <table width="680"
                   cellpadding="0"
                   cellspacing="0"
                   style="
                       width:100%;
                       max-width:680px;
                       background:#ffffff;
                       border-collapse:collapse;
                   ">

                <tr>
                    <td style="
                        padding:28px;
                        text-align:center;
                        border-bottom:1px solid #eeeeee;
                    ">
                        <div style="
                            color:#ee4d2d;
                            font-size:32px;
                            font-weight:700;
                        ">
                            Hair
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:30px 36px;">

                        <p style="
                            margin:0 0 18px;
                            font-size:16px;
                        ">
                            Xin chào
                            <strong th:text="${customerName}">
                                Khách hàng
                            </strong>,
                        </p>

                        <p style="
                            margin:0 0 14px;
                            font-size:16px;
                            line-height:1.6;
                        ">
                            Đơn hàng
                            <strong
                                    style="color:#ee4d2d;"
                                    th:text="'#' + ${orderId}">
                                #1
                            </strong>
                            của bạn đã bị hủy.
                        </p>

                        <p style="
                            margin:0;
                            font-size:15px;
                            line-height:1.6;
                            color:#666666;
                        ">
                            Trạng thái hiện tại:
                            <strong th:text="${orderStatus}">
                                Đã hủy
                            </strong>
                        </p>

                    </td>
                </tr>

                <tr>
                    <td style="
                        padding:24px 36px;
                        border-top:1px solid #eeeeee;
                    ">
                        <p style="margin:0 0 8px;">
                            Trân trọng,
                        </p>

                        <strong>Đội ngũ Hair</strong>
                    </td>
                </tr>

                <tr>
                    <td style="
                        padding:22px 36px;
                        background:#fafafa;
                        color:#999999;
                        font-size:12px;
                        text-align:center;
                        line-height:1.6;
                    ">
                        Đây là email tự động.
                        Vui lòng không trả lời email này.
                        <br>
                        © 2026 Hair
                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
